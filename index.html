<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b5cf6"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Fit Calendar Premium 9.0</title>
<style>
:root{--pink:#ec4899;--purple:#8b5cf6;--violet:#6366f1;--ink:#241d2b;--muted:#756c7d;--line:#eadff1;--bg:#fff8fc;--card:#fff;--soft:#f6eff9;--good:#16a34a;--warn:#d97706;--danger:#dc2626}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% 0,#ffd9ef 0,transparent 30%),radial-gradient(circle at 100% 10%,#e3dcff 0,transparent 32%),linear-gradient(145deg,#fff8fc,#f4f0ff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.wrap{max-width:900px;margin:auto;padding:14px 14px 100px}.hero{position:relative;overflow:hidden;color:#fff;border-radius:32px;padding:25px;background:linear-gradient(135deg,#db2777,#a855f7 52%,#4f46e5);box-shadow:0 22px 55px #7c3aed2b}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-50px;top:-70px;background:#fff2;filter:blur(3px)}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:900;opacity:.95}.hero h1{font-size:36px;line-height:1;margin:8px 0 10px}.hero p{margin:0 0 20px;opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#ffffff1c;border:1px solid #ffffff45;border-radius:18px;padding:12px;text-align:center;backdrop-filter:blur(8px)}.stat b{display:block;font-size:23px}.stat span{font-size:10px;font-weight:800;opacity:.9}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.nav button{padding:11px 4px;border-radius:17px;background:#fff;border:1px solid var(--line);color:#675d6c;font-size:11px;font-weight:900;box-shadow:0 6px 18px #46205c08}.nav button.on{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border-color:transparent}.card{background:#fffffff2;border:1px solid var(--line);border-radius:25px;padding:18px;margin:13px 0;box-shadow:0 10px 35px #46205c0d;backdrop-filter:blur(10px)}.label{font-size:11px;color:#c23c83;font-weight:950;letter-spacing:1.5px}.card h2{margin:5px 0 12px;font-size:24px}.muted{font-size:13px;color:var(--muted);line-height:1.55}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{padding:12px 15px;border-radius:15px;font-weight:900}.primary{color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 8px 20px #a855f733}.soft{color:#514657;background:var(--soft)}.danger{color:#991b1b;background:#fee2e2}.good{color:#166534;background:#dcfce7}.input,select,input,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:#fcf9fd;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#b47be5;box-shadow:0 0 0 3px #a855f71a}textarea{min-height:90px;resize:vertical}.item{padding:14px;border:1px solid var(--line);border-radius:18px;margin:9px 0;background:#fff}.row{display:flex;justify-content:space-between;align-items:center;gap:9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions .btn{font-size:12px}.tag{display:inline-block;background:#f1e7ff;color:#7134a7;border-radius:99px;padding:4px 9px;font-size:10px;font-weight:900}.progress{height:9px;background:#eee7f3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple),var(--violet));border-radius:99px}.search{margin:10px 0}.empty{text-align:center;padding:22px;border:1px dashed #dccde5;border-radius:18px;color:var(--muted)}.day{border-left:4px solid #a855f7}.exercise{padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:16px;background:#fcf9fd}.exercise-grid{display:grid;grid-template-columns:1.5fr .55fr .65fr .65fr;gap:7px;align-items:center}.exercise-grid input{padding:9px}.exercise-grid small{display:block;color:var(--muted);font-size:10px}.modal{position:fixed;inset:0;background:#170f1b88;z-index:50;display:flex;align-items:flex-end;padding:10px}.modalbox{background:#fff;width:min(850px,100%);max-height:94vh;overflow:auto;border-radius:28px;padding:19px;box-shadow:0 -20px 70px #170f1b44}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:23px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#241d2b;color:#fff;padding:12px 17px;border-radius:99px;z-index:100;font-size:13px;box-shadow:0 10px 30px #0003}.client-banner{margin-top:12px;background:linear-gradient(135deg,#fff,#f8efff);border:1px solid var(--line);border-radius:22px;padding:16px}.notice{padding:12px 14px;border-radius:15px;background:#fff7ed;color:#92400e;font-size:12px;line-height:1.5}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi>div{padding:12px;border-radius:16px;background:var(--soft);text-align:center}.kpi b{display:block;font-size:19px}.kpi span{font-size:9px;color:var(--muted);font-weight:800}.small{font-size:11px}.divider{height:1px;background:var(--line);margin:14px 0}.hide{display:none!important}@media(max-width:560px){.hero h1{font-size:31px}.nav button{font-size:9px}.grid2{grid-template-columns:1fr}.kpi{grid-template-columns:repeat(2,1fr)}.exercise-grid{grid-template-columns:1.3fr .55fr .6fr .65fr}.wrap{padding-left:10px;padding-right:10px}}
</style></head><body><div id="root"></div><script>
const KEY='fit-calendar-premium-9';
const seed={trainer:{name:'Мой тренер',youtube:'',brand:'Fit Calendar Premium'},library:[
{id:'e1',name:'Присед со штангой',muscle:'Ягодицы + ноги',sets:3,reps:10,weight:40,video:'',note:'Контролируемая техника'},
{id:'e2',name:'Ягодичный мост',muscle:'Ягодицы',sets:3,reps:12,weight:30,video:'',note:'Пауза вверху'},
{id:'e3',name:'Румынская тяга',muscle:'Задняя поверхность бедра',sets:3,reps:10,weight:30,video:'',note:'Спина нейтральная'},
{id:'e4',name:'Болгарские выпады',muscle:'Ягодицы + ноги',sets:3,reps:10,weight:10,video:'',note:''}],clients:[]};
let db=load();let ui={tab:'home',client:null,search:''};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function stats(){const ds=db.clients.flatMap(c=>c.program||[]);return {all:ds.length,done:ds.filter(d=>d.done).length,p:ds.length?Math.round(ds.filter(d=>d.done).length/ds.length*100):0,clients:db.clients.length}}
function go(t){ui.tab=t;ui.client=null;render();scrollTo(0,0)}
function shell(content){const s=stats();root.innerHTML=`<main class="wrap"><section class="hero"><div class="eyebrow">PREMIUM TRAINER APP · 9.0</div><h1>Fit Calendar</h1><p>Тренировки · клиенты · библиотека · прогресс</p><div class="stats"><div class="stat"><b>${s.clients}</b><span>КЛИЕНТОВ</span></div><div class="stat"><b>${s.all}</b><span>ТРЕНИРОВОК</span></div><div class="stat"><b>${s.p}%</b><span>ВЫПОЛНЕНО</span></div></div></section><nav class="nav">${[['home','✨','Главная'],['calendar','📅','Календарь'],['library','📚','Библиотека'],['clients','👩','Клиенты'],['trainer','⚙️','Тренер']].map(x=>`<button class="${ui.tab===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}</nav>${content}<p class="muted" style="text-align:center;margin-top:26px">Fit Calendar Premium · данные этой версии сохраняются на устройстве тренера</p></main>`}
function home(){const s=stats();return `<div class="card"><div class="label">ПАНЕЛЬ ТРЕНЕРА</div><h2>Всё под рукой ✨</h2><p class="muted">Создай упражнение один раз в библиотеке, собери индивидуальную программу и отправь клиенту его персональную ссылку.</p><div class="grid2"><button class="btn primary" onclick="newClient()">＋ Новый клиент</button><button class="btn soft" onclick="newExercise()">＋ Добавить упражнение</button></div></div><div class="card"><div class="kpi"><div><b>${db.library.length}</b><span>УПРАЖНЕНИЙ</span></div><div><b>${s.clients}</b><span>КЛИЕНТОВ</span></div><div><b>${s.all}</b><span>ТРЕНИРОВОК</span></div><div><b>${s.done}</b><span>ВЫПОЛНЕНО</span></div></div></div><div class="card"><h2>Как работать</h2><div class="item"><b>1 · Библиотека</b><p class="muted">Добавь упражнение один раз: название, мышечная группа, подходы, повторы, вес и YouTube.</p></div><div class="item"><b>2 · Клиент</b><p class="muted">Создай отдельного клиента и его программу.</p></div><div class="item"><b>3 · Персональная ссылка</b><p class="muted">Клиент получает только свою программу и не получает доступ к тренерскому редактору.</p></div><div class="item"><b>4 · Результаты</b><p class="muted">В этой автономной версии результаты сохраняются локально. Облачная синхронизация между телефонами — следующий этап.</p></div></div>`}
function library(){let arr=db.library.filter(e=>(e.name+' '+e.muscle).toLowerCase().includes(ui.search.toLowerCase()));return `<div class="card"><div class="row"><div><div class="label">ЕДИНАЯ БИБЛИОТЕКА</div><h2>Упражнения</h2></div><button class="btn primary" onclick="newExercise()">＋ Добавить</button></div><input class="search" placeholder="Поиск упражнения..." value="${esc(ui.search)}" oninput="ui.search=this.value;render()">${arr.length?arr.map(e=>`<div class="item"><div class="row"><div><b>${esc(e.name)}</b><br><span class="tag">${esc(e.muscle)}</span></div><button class="btn soft" onclick="editExercise('${e.id}')">Изменить</button></div><p class="muted">${e.sets} подхода × ${e.reps} повтора · <b>${e.weight||0} кг</b>${e.note?' · '+esc(e.note):''}</p>${e.video?`<a href="${esc(e.video)}" target="_blank">🎥 Смотреть YouTube</a>`:''}<div class="actions"><button class="btn danger" onclick="removeExercise('${e.id}')">Удалить</button></div></div>`).join(''):`<div class="empty">Упражнений не найдено.</div>`}</div>`}
function clients(){return `<div class="card"><div class="row"><div><div class="label">БАЗА КЛИЕНТОВ</div><h2>Мои клиенты</h2></div><button class="btn primary" onclick="newClient()">＋ Клиент</button></div>${db.clients.length?db.clients.map(c=>`<div class="item"><div class="row"><div><b>${esc(c.name)}</b><br><span class="muted">${esc(c.goal||'Цель не указана')}</span></div><button class="btn primary" onclick="openClient('${c.id}')">Открыть</button></div><div class="progress" style="margin-top:10px"><i style="width:${progress(c)}%"></i></div><div class="row small" style="margin-top:5px"><span>${progress(c)}% программы</span><span>${(c.program||[]).filter(d=>d.done).length}/${(c.program||[]).length} тренировок</span></div><div class="actions"><button class="btn soft" onclick="share('${c.id}')">🔗 Ссылка</button><button class="btn soft" onclick="clientStats('${c.id}')">📊 Результаты</button><button class="btn danger" onclick="removeClient('${c.id}')">Удалить</button></div></div>`).join(''):`<div class="empty">Клиентов пока нет.<br><button class="btn primary" style="margin-top:10px" onclick="newClient()">Создать первого</button></div>`}</div>`}
function progress(c){const p=c.program||[];return p.length?Math.round(p.filter(d=>d.done).length/p.length*100):0}
function openClient(id){ui.tab='clients';ui.client=id;render()}
function clientPage(c){return `<div class="card"><div class="row"><div><div class="label">ПЕРСОНАЛЬНАЯ ПРОГРАММА</div><h2>${esc(c.name)}</h2></div><button class="btn soft" onclick="ui.client=null;render()">← Назад</button></div><p class="muted">${esc(c.goal||'')}</p><div class="grid2"><button class="btn primary" onclick="newDay('${c.id}')">＋ Тренировочный день</button><button class="btn soft" onclick="share('${c.id}')">🔗 Персональная ссылка</button></div></div>${(c.program||[]).map(d=>day(c,d)).join('')||`<div class="card empty">Программа пустая. Добавь первый тренировочный день.</div>`}<div class="card"><div class="label">АНАЛИТИКА</div><h2>Прогресс ${progress(c)}%</h2><div class="progress"><i style="width:${progress(c)}%"></i></div><div class="kpi" style="margin-top:12px"><div><b>${(c.program||[]).length}</b><span>ПЛАН</span></div><div><b>${(c.program||[]).filter(d=>d.done).length}</b><span>ВЫПОЛНЕНО</span></div><div><b>${(c.program||[]).reduce((n,d)=>n+(d.exercises||[]).length,0)}</b><span>УПРАЖНЕНИЙ</span></div><div><b>${lastDone(c)}</b><span>ПОСЛЕДНЯЯ</span></div></div></div>`}
function lastDone(c){const a=(c.program||[]).filter(d=>d.done).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));return a[0]?new Date(a[0].completedAt).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}):'—'}
function day(c,d){return `<div class="card day"><div class="row"><div><b>${esc(d.title)}</b><br><span class="muted">${esc(d.date||'Дата не указана')} ${d.done?'· ✓ выполнено':''}</span></div><button class="btn danger" onclick="removeDay('${c.id}','${d.id}')">Удалить</button></div>${(d.exercises||[]).map((x,i)=>`<div class="exercise"><div class="exercise-grid"><div><b>${esc(x.name)}</b>${x.video?`<br><a class="small" href="${esc(x.video)}" target="_blank">🎥 видео</a>`:''}</div><div><small>ПОДХ.</small><input type="number" min="0" value="${x.sets}" onchange="changeEx('${c.id}','${d.id}',${i},'sets',this.value)"></div><div><small>ПОВТ.</small><input type="number" min="0" value="${x.reps}" onchange="changeEx('${c.id}','${d.id}',${i},'reps',this.value)"></div><div><small>ВЕС КГ</small><input type="number" min="0" step="0.5" value="${x.weight||0}" onchange="changeEx('${c.id}','${d.id}',${i},'weight',this.value)"></div></div><div class="actions"><button class="btn soft" onclick="removeEx('${c.id}','${d.id}',${i})">Убрать</button></div></div>`).join('')}<div class="actions"><button class="btn soft" onclick="chooseExercise('${c.id}','${d.id}')">＋ Из библиотеки</button><button class="btn soft" onclick="customExercise('${c.id}','${d.id}')">＋ Своё</button><button class="btn ${d.done?'soft':'primary'}" onclick="toggleDay('${c.id}','${d.id}')">${d.done?'↩ Вернуть в план':'✓ Отметить выполненной'}</button></div></div>`}
function calendar(){let a=db.clients.flatMap(c=>(c.program||[]).map(d=>({...d,client:c.name,cid:c.id}))).sort((a,b)=>(a.date||'').localeCompare(b.date||''));return `<div class="card"><div class="label">КАЛЕНДАРЬ ТРЕНЕРА</div><h2>Все тренировки</h2>${a.length?a.map(d=>`<div class="item"><div class="row"><div><b>${esc(d.date||'Без даты')} · ${esc(d.title)}</b><br><span class="muted">${esc(d.client)}</span></div><span class="tag">${d.done?'✓ Выполнено':'План'}</span></div><p class="muted">${(d.exercises||[]).length} упражнений</p><button class="btn soft" onclick="openClient('${d.cid}')">Открыть клиента</button></div>`).join(''):`<div class="empty">Календарь пока пуст.</div>`}</div>`}
function trainer(){return `<div class="card"><div class="label">НАСТРОЙКИ ТРЕНЕРА</div><h2>Профиль и бренд</h2><label class="muted">Имя тренера</label><input id="tn" value="${esc(db.trainer.name)}"><label class="muted">YouTube тренера</label><input id="ty" style="margin-top:8px" value="${esc(db.trainer.youtube)}" placeholder="https://youtube.com/@..."><label class="muted">Название приложения</label><input id="tb" style="margin-top:8px" value="${esc(db.trainer.brand)}"><button class="btn primary" style="margin-top:10px" onclick="saveTrainer()">Сохранить</button></div><div class="card"><h2>🔗 Персональные ссылки</h2><p class="muted">Каждому клиенту создаётся отдельная ссылка. Клиент не видит тренерскую библиотеку и редактор.</p><div class="notice">Важно: эта версия работает как автономное приложение. Программа передаётся в ссылке, а выполнение клиента пока не отправляется автоматически обратно в твой телефон. Для этого подключим облачную базу на следующем этапе.</div></div><div class="card"><h2>💾 Данные</h2><p class="muted">Сделай резервную копию перед крупными изменениями.</p><div class="actions"><button class="btn soft" onclick="backup()">⬇️ Скачать резервную копию</button><button class="btn soft" onclick="restore()">⬆️ Восстановить</button><button class="btn danger" onclick="resetAll()">Сбросить всё</button></div></div>`}
function render(){if(ui.tab==='home')shell(home());else if(ui.tab==='library')shell(library());else if(ui.tab==='clients')shell(ui.client?clientPage(db.clients.find(c=>c.id===ui.client)):clients());else if(ui.tab==='calendar')shell(calendar());else shell(trainer())}
function modal(title,body){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="this.closest('.modal').remove()">×</button></div>${body}</div>`;document.body.appendChild(m);return m}
function newExercise(e){e=e||{id:'',name:'',muscle:'',sets:3,reps:10,weight:0,video:'',note:''};modal(e.id?'Изменить упражнение':'Новое упражнение',`<label class="muted">Название</label><input id="xn" value="${esc(e.name)}" placeholder="Например: Присед со штангой"><label class="muted">Мышечная группа</label><input id="xm" style="margin-top:8px" value="${esc(e.muscle)}" placeholder="Ягодицы + ноги"><div class="grid3" style="margin-top:8px"><div><label class="muted">Подходы</label><input id="xs" type="number" min="0" value="${e.sets}"></div><div><label class="muted">Повторы</label><input id="xr" type="number" min="0" value="${e.reps}"></div><div><label class="muted">Вес, кг</label><input id="xw" type="number" min="0" step="0.5" value="${e.weight||0}"></div></div><label class="muted">YouTube</label><input id="xv" style="margin-top:8px" value="${esc(e.video)}" placeholder="https://youtu.be/..."><label class="muted">Комментарий</label><textarea id="xo" style="margin-top:8px" placeholder="Техника, подсказки тренера...">${esc(e.note)}</textarea><button class="btn primary" style="margin-top:10px;width:100%" onclick="saveExercise('${e.id}',this)">Сохранить упражнение</button>`)}
function editExercise(id){newExercise(db.library.find(e=>e.id===id))}
function saveExercise(id,b){const e={id:id||uid(),name:xn.value.trim(),muscle:xm.value.trim()||'Другое',sets:+xs.value||0,reps:+xr.value||0,weight:+xw.value||0,video:xv.value.trim(),note:xo.value.trim()};if(!e.name)return toast('Напиши название');const i=db.library.findIndex(x=>x.id===id);if(i<0)db.library.push(e);else db.library[i]=e;save();b.closest('.modal').remove();render();toast('Упражнение сохранено ✓')}
function removeExercise(id){if(confirm('Удалить упражнение из общей библиотеки? Уже добавленные в программы копии останутся.')){db.library=db.library.filter(e=>e.id!==id);save();render();toast('Удалено')}}
function newClient(){modal('Новый клиент',`<label class="muted">Имя</label><input id="cn" placeholder="Имя клиента"><label class="muted">Цель</label><input id="cg" style="margin-top:8px" placeholder="Например: ягодицы, сила, снижение веса"><button class="btn primary" style="margin-top:10px;width:100%" onclick="saveClient(this)">Создать клиента</button>`)}
function saveClient(b){const name=cn.value.trim();if(!name)return toast('Укажи имя');db.clients.push({id:uid(),name,goal:cg.value.trim(),program:[],createdAt:new Date().toISOString()});save();b.closest('.modal').remove();render();toast('Клиент создан ✓')}
function removeClient(id){if(confirm('Удалить клиента и его программу?')){db.clients=db.clients.filter(c=>c.id!==id);ui.client=null;save();render()}}
function newDay(cid){modal('Новый тренировочный день',`<label class="muted">Название</label><input id="dt" placeholder="Ягодицы + ноги"><label class="muted">Дата</label><input id="dd" type="date" style="margin-top:8px" value="${new Date().toISOString().slice(0,10)}"><button class="btn primary" style="margin-top:10px;width:100%" onclick="saveDay('${cid}',this)">Создать тренировку</button>`)}
function saveDay(cid,b){const c=db.clients.find(x=>x.id===cid);c.program.push({id:uid(),title:dt.value.trim()||'Новая тренировка',date:dd.value,done:false,completedAt:null,exercises:[]});save();b.closest('.modal').remove();render()}
function removeDay(cid,did){const c=db.clients.find(x=>x.id===cid);c.program=c.program.filter(d=>d.id!==did);save();render()}
function chooseExercise(cid,did){const list=db.library.map(e=>`<button class="btn soft" style="display:block;width:100%;text-align:left;margin:7px 0" onclick="pickExercise('${cid}','${did}','${e.id}',this)"><b>${esc(e.name)}</b><br><span class="small">${esc(e.muscle)} · ${e.sets}×${e.reps} · ${e.weight||0} кг</span></button>`).join('');modal('Добавить из общей библиотеки',list||'<div class="empty">Библиотека пуста.</div>')}
function pickExercise(cid,did,eid,b){const c=db.clients.find(x=>x.id===cid),d=c.program.find(x=>x.id===did),e=db.library.find(x=>x.id===eid);d.exercises.push({id:uid(),name:e.name,muscle:e.muscle,sets:e.sets,reps:e.reps,weight:e.weight,video:e.video,note:e.note});save();b.closest('.modal').remove();render();toast('Добавлено ✓')}
function customExercise(cid,did){modal('Своё упражнение',`<input id="sn" placeholder="Название"><div class="grid3" style="margin-top:8px"><input id="ss" type="number" value="3" placeholder="Подходы"><input id="sr" type="number" value="10" placeholder="Повторы"><input id="sw" type="number" value="0" placeholder="Вес кг"></div><button class="btn primary" style="margin-top:10px;width:100%" onclick="saveCustom('${cid}','${did}',this)">Добавить</button>`)}
function saveCustom(cid,did,b){const c=db.clients.find(x=>x.id===cid),d=c.program.find(x=>x.id===did);if(!sn.value.trim())return toast('Укажи название');d.exercises.push({id:uid(),name:sn.value.trim(),sets:+ss.value||0,reps:+sr.value||0,weight:+sw.value||0,video:''});save();b.closest('.modal').remove();render()}
function changeEx(cid,did,i,k,v){const d=db.clients.find(c=>c.id===cid).program.find(x=>x.id===did);d.exercises[i][k]=k==='name'?v:+v;save()}
function removeEx(cid,did,i){const d=db.clients.find(c=>c.id===cid).program.find(x=>x.id===did);d.exercises.splice(i,1);save();render()}
function toggleDay(cid,did){const d=db.clients.find(c=>c.id===cid).program.find(x=>x.id===did);d.done=!d.done;d.completedAt=d.done?new Date().toISOString():null;save();render();toast(d.done?'Тренировка отмечена ✓':'Отметка снята')}
function share(id){const c=db.clients.find(x=>x.id===id);const payload={version:9,name:c.name,goal:c.goal,program:c.program,trainer:db.trainer};const enc=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));const link=location.origin+location.pathname+'?client='+encodeURIComponent(enc);modal('🔗 Персональная ссылка',`<p class="muted">Эта ссылка содержит только программу клиента. Тренерский редактор и библиотека не показываются.</p><textarea id="sharelink">${esc(link)}</textarea><div class="actions"><button class="btn primary" onclick="copyLink()">📋 Скопировать ссылку</button><button class="btn soft" onclick="window.open(sharelink.value,'_blank')">Открыть</button></div><p class="muted small">Для полноценного облачного контроля результатов нам понадобится база данных и авторизация. Это будет следующий этап.</p>`)}
function copyLink(){navigator.clipboard?.writeText(sharelink.value);toast('Ссылка скопирована ✓')}
function clientStats(id){const c=db.clients.find(x=>x.id===id);const rows=(c.program||[]).map(d=>`<div class="item"><div class="row"><b>${esc(d.title)}</b><span class="tag">${d.done?'✓ Выполнено':'Не выполнено'}</span></div><span class="muted">${esc(d.date||'')}</span></div>`).join('')||'<div class="empty">Нет тренировок.</div>';modal('📊 Результаты · '+esc(c.name),`<div class="kpi"><div><b>${(c.program||[]).length}</b><span>ТРЕНИРОВОК</span></div><div><b>${(c.program||[]).filter(d=>d.done).length}</b><span>ВЫПОЛНЕНО</span></div><div><b>${progress(c)}%</b><span>ПРОГРЕСС</span></div><div><b>${lastDone(c)}</b><span>ПОСЛЕДНЯЯ</span></div></div><div class="divider"></div>${rows}`)}
function saveTrainer(){db.trainer.name=tn.value.trim()||'Мой тренер';db.trainer.youtube=ty.value.trim();db.trainer.brand=tb.value.trim()||'Fit Calendar Premium';save();toast('Настройки сохранены ✓');render()}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='fit-calendar-premium-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.library||!x.clients)throw Error();db=x;save();render();toast('Резервная копия восстановлена ✓')}catch(e){toast('Неверный JSON-файл')}};r.readAsText(i.files[0])};i.click()}
function resetAll(){if(confirm('Удалить все локальные данные?')){localStorage.removeItem(KEY);db=load();render();toast('Данные сброшены')}}
function decodePayload(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e){return null}}
function clientMode(payload){const c=payload||{};root.innerHTML=`<main class="wrap"><section class="hero"><div class="eyebrow">PERSONAL TRAINING · ${esc(c.trainer?.brand||'FIT CALENDAR')}</div><h1>${esc(c.name||'Моя программа')}</h1><p>${esc(c.goal||'Персональная программа')}</p><div class="stats"><div class="stat"><b>${(c.program||[]).length}</b><span>ТРЕНИРОВОК</span></div><div class="stat"><b>${(c.program||[]).filter(d=>d.done).length}</b><span>ВЫПОЛНЕНО</span></div><div class="stat"><b>${(c.program||[]).length?Math.round((c.program||[]).filter(d=>d.done).length/(c.program||[]).length*100):0}%</b><span>ПРОГРЕСС</span></div></div></section><div class="client-banner"><b>👋 Привет, ${esc(c.name||'спортсмен')}!</b><p class="muted">Это твоя персональная программа. Выполняй тренировки по плану. Вес, подходы и повторы указаны тренером.</p></div>${(c.program||[]).map(d=>`<div class="card"><div class="row"><div><div class="label">ТРЕНИРОВОЧНЫЙ ДЕНЬ</div><h2>${esc(d.title)}</h2></div><span class="tag">${esc(d.date||'')}</span></div>${(d.exercises||[]).map(x=>`<div class="exercise"><div class="row"><div><b>${esc(x.name)}</b><br><span class="muted">${x.sets} подхода × ${x.reps} повторов · <b>${x.weight||0} кг</b></span></div>${x.video?`<a class="btn soft" href="${esc(x.video)}" target="_blank">🎥 Видео</a>`:''}</div>${x.note?`<p class="muted">💡 ${esc(x.note)}</p>`:''}</div>`).join('')}<button class="btn ${d.done?'good':'primary'}" style="width:100%;margin-top:10px" onclick="this.className='btn good';this.textContent='✓ Тренировка отмечена';this.disabled=true">${d.done?'✓ Уже отмечено':'Завершить тренировку ✓'}</button></div>`).join('')||'<div class="card empty">Программа пока не добавлена.</div>'}<p class="muted" style="text-align:center">${esc(c.trainer?.name||'Тренер')} · Fit Calendar Premium</p></main>`}
const q=new URLSearchParams(location.search).get('client');if(q){clientMode(decodePayload(q))}else render();
</script></body></html>
