<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b5cf6">
<title>Fit Calendar</title>
<style>
:root{--p:#d92f9d;--p2:#7652f5;--ink:#272333;--muted:#777181;--card:#fff;--soft:#f5effa;--line:#eadff0;--ok:#25a269;--danger:#d94b64;--shadow:0 12px 35px rgba(68,35,100,.09)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff,#faf4ff 55%,#f8f4ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:820px;margin:auto;padding:16px 12px 45px}
.hero{border-radius:32px;padding:25px 22px;color:#fff;background:linear-gradient(135deg,#e329a2,#9a4ff0 55%,#5b4df2);box-shadow:0 18px 45px rgba(143,59,224,.22)}
.eyebrow{font-size:12px;letter-spacing:2.5px;font-weight:900}.hero h1{font-size:38px;margin:8px 0 5px}.hero p{font-size:17px;margin:0 0 20px;opacity:.92}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border:1px solid #ffffff66;border-radius:19px;padding:12px 5px;text-align:center;background:#ffffff1a}.stat b{font-size:24px;display:block}.stat span{font-size:10px;font-weight:900}
.nav{display:flex;gap:7px;overflow-x:auto;margin:16px 0;padding-bottom:2px}.nav button{flex:0 0 auto;padding:12px 13px;border-radius:17px;background:#fff;color:#655d6d;box-shadow:0 5px 18px #4628640f;font-weight:850}.nav button.active{color:#fff;background:linear-gradient(135deg,var(--p),var(--p2))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;margin:13px 0;box-shadow:var(--shadow)}.kicker{color:#ba3788;letter-spacing:2.5px;font-size:11px;font-weight:900}.panel h2{font-size:26px;margin:6px 0}.muted{color:var(--muted);line-height:1.5}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.video-btn{display:block;text-align:center;padding:11px 13px;border-radius:13px;background:#f3e9ff;color:#7b3fa0;font-weight:900;text-decoration:none;border:1px solid #ead9f5}.video-btn:active{transform:scale(.99)}.primary{width:100%;padding:15px;border-radius:16px;color:#fff;font-weight:900;background:linear-gradient(90deg,#e834a1,#8d4ff1);margin-top:11px}.secondary{width:100%;padding:13px;border-radius:15px;background:var(--soft);color:#51485b;font-weight:850;margin-top:8px}.small{padding:9px 11px;border-radius:11px;background:var(--soft);font-weight:800}.danger{color:var(--danger)}
.item,.exercise-box{padding:14px;border:1px solid var(--line);border-radius:18px;margin:9px 0;background:#fff}.exercise-box{background:#fcf9ff}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.tag{display:inline-block;padding:5px 8px;border-radius:9px;background:#f4eafb;color:#8c4d9f;font-size:11px;font-weight:800}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #e2d7e8;border-radius:14px;background:#fff;outline:none;color:var(--ink);margin:5px 0 10px}textarea{min-height:85px;resize:vertical}label{font-size:12px;font-weight:850;color:#665e6d}.check{display:flex;gap:8px;align-items:center;margin:7px 0}.check input{width:auto;margin:0}
.modal{position:fixed;inset:0;background:#23182d7a;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}.sheet{width:min(820px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:27px 27px 0 0;padding:22px 17px 30px}.sheet h2{margin-top:0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:70px;cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:6px;background:#fff}.day.today{outline:2px solid #9d58ef}.dot{display:block;margin-top:7px;font-size:9px;color:#fff;background:#9b55ed;border-radius:6px;padding:3px;overflow:hidden;white-space:nowrap}
.months{display:grid;grid-template-columns:1fr 1fr;gap:12px}.month-card{border:1px solid var(--line);border-radius:19px;padding:12px;background:#fff}.month-title{font-size:17px;font-weight:950;margin:2px 0 10px;text-transform:capitalize}.month-card .day{min-height:64px;padding:5px}.month-card .dot{font-size:8px;padding:2px;margin-top:4px}.schedule-dot{display:block;margin-top:4px;font-size:8px;color:#7b3fa0;font-weight:900;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.client-calendar .day{cursor:default}.day.has-workout{background:#faf4ff;border-color:#d9c2ec}.day.done-day{background:#eefaf4;border-color:#bde6d0}
@media(max-width:540px){.months{grid-template-columns:1fr}.month-card .day{min-height:58px}}
.set-row{display:grid;grid-template-columns:42px 62px minmax(0,1fr) minmax(0,1fr) 48px;gap:7px;align-items:center;margin:7px 0;padding:5px 6px;border-radius:14px;background:#f8f5fb}.set-row input{margin:0;padding:10px}.set-num{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:12px;background:#f1e6f8;color:#87439d;font-size:16px;font-weight:950}.set-label{font-size:10px;font-weight:900;color:#8a8394;text-align:center;line-height:1.05}.set-done{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}.set-done .set-check{width:30px;height:30px;margin:0!important;justify-self:center;accent-color:#8b5cf6}.set-done span{display:none}.set-check{width:30px;height:30px;margin:0!important;justify-self:center;accent-color:#8b5cf6}.done{background:#eefaf4;border-color:#bde6d0}.progress{height:8px;background:#eee8f3;border-radius:99px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#e834a1,#8d4ff1)}
.client-hero{background:linear-gradient(135deg,#f8eafa,#eee8ff);border-radius:20px;padding:16px}.linkbox{background:#f8f4ff;border:1px dashed #bca9d6;border-radius:15px;padding:12px;font-size:12px;word-break:break-all}
.empty{text-align:center;padding:24px;color:var(--muted)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#272333;color:#fff;padding:11px 16px;border-radius:14px;display:none;z-index:50}.toast.show{display:block}
@media(max-width:540px){.hero h1{font-size:33px}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.set-row{grid-template-columns:42px 1fr 1fr 48px}.app{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div id="root"></div><div id="modal" class="modal"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://dnbpqlnqmyvnukhwcdhv.supabase.co";
const QUERY=new URLSearchParams(location.search);
let SUPABASE_ANON_KEY=localStorage.getItem("fit-calendar-supabase-key")||QUERY.get("sbkey")||"";
if(QUERY.get("sbkey")) localStorage.setItem("fit-calendar-supabase-key",QUERY.get("sbkey"));
const DATA_TABLE="fit_calendar_data",KEY="fit-calendar-premium-10";
const seed={mode:"trainer",selectedClient:null,trainer:{name:"Мой тренер",instagram:""},clients:[],exercises:[
{id:"e1",name:"Присед со штангой",muscle:"Ноги",video:""},{id:"e2",name:"Ягодичный мост",muscle:"Ягодицы",video:""},
{id:"e3",name:"Румынская тяга",muscle:"Задняя поверхность бедра",video:""},{id:"e4",name:"Жим гантелей",muscle:"Грудь",video:""}],programs:[],workouts:[]};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||JSON.parse(JSON.stringify(seed));
let cloud=null,cloudBusy=false,saveTimer=null,clientSession=null;
function localSave(){localStorage.setItem(KEY,JSON.stringify(db))}
function setCloudStatus(t,ok=false){const e=document.getElementById("cloudStatus");if(e){e.textContent=(ok?"☁️ ":"⚠️ ")+t;e.style.color=ok?"#25a269":"#b7791f"}}
function initCloud(){if(!SUPABASE_ANON_KEY)return false;if(!window.supabase)return false;try{cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);return true}catch{return false}}
function timeout(p,ms=8000){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))])}
async function loadCloud(){if(!cloud||cloudBusy)return false;cloudBusy=true;setCloudStatus("Подключаемся…");try{const {data,error}=await timeout(cloud.from(DATA_TABLE).select("id,data,updated_at").eq("id","main").maybeSingle());if(error)throw error;if(data?.data){db={...JSON.parse(JSON.stringify(seed)),...data.data};localSave()}else{const {error:e}=await timeout(cloud.from(DATA_TABLE).upsert({id:"main",data:db,updated_at:new Date().toISOString()},{onConflict:"id"}));if(e)throw e}setCloudStatus("Синхронизировано",true);return true}catch(e){setCloudStatus("Облако недоступно");return false}finally{cloudBusy=false}}
async function saveCloud(){localSave();if(!cloud)return;try{const {error}=await timeout(cloud.from(DATA_TABLE).upsert({id:"main",data:db,updated_at:new Date().toISOString()},{onConflict:"id"}));if(error)throw error;setCloudStatus("Сохранено в облако",true)}catch{setCloudStatus("Сохранено локально")}}
function save(){localSave();clearTimeout(saveTimer);saveTimer=setTimeout(saveCloud,300)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
function openModal(c){document.getElementById("sheet").innerHTML=c;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}
function stats(){return{clients:db.clients.length,workouts:db.workouts.length,done:db.workouts.filter(w=>w.done).length,ex:db.exercises.length}}
function go(t){window.tab=t;render()}
function nav(){return["home","calendar","programs","library","clients","trainer"].map((x,i)=>`<button class="${(window.tab||"home")===x?"active":""}" onclick="go('${x}')">${["🏠 Главная","📅 Календарь","📋 Программы","📚 Библиотека","👥 Клиенты","🧑‍🏫 Тренер"][i]}</button>`).join("")}
function render(){
 if(clientSession)return renderClient();
 const s=stats();document.getElementById("root").innerHTML=`<main class="app">
 <section class="hero"><div class="eyebrow">PREMIUM TRAINER APP</div><h1>Fit Calendar</h1><p>Тренировки · клиенты · программы · прогресс</p>
 <div class="stats"><div class="stat"><b>${s.clients}</b><span>КЛИЕНТОВ</span></div><div class="stat"><b>${s.workouts}</b><span>ТРЕНИРОВОК</span></div><div class="stat"><b>${s.workouts?Math.round(s.done/s.workouts*100):0}%</b><span>ВЫПОЛНЕНО</span></div></div></section>
 <nav class="nav">${nav()}</nav><div id="content">${content(window.tab||"home")}</div>
 <div style="text-align:center;color:#938a9b;font-size:12px;margin-top:20px"><span id="cloudStatus">☁️ ${cloud?"Облако подключено":"Локальный режим"}</span></div></main>`
}
function content(t){if(t==="calendar")return calendar();if(t==="library")return library();if(t==="clients")return clients();if(t==="programs")return programs();if(t==="trainer")return trainer();return home()}
function home(){return `<section class="panel"><div class="kicker">ПАНЕЛЬ ТРЕНЕРА</div><h2>Всё под рукой ✨</h2><p class="muted">Создай упражнение, программу, назначь тренировку и получай реальные результаты клиента.</p>
<button class="primary" onclick="addClient()">＋ Новый клиент</button><button class="secondary" onclick="addExercise()">＋ Добавить упражнение</button><button class="secondary" onclick="addProgram()">＋ Создать программу</button></section>
<section class="panel"><div class="grid2"><div class="item"><b>${db.exercises.length}</b><br><span class="muted">УПРАЖНЕНИЙ</span></div><div class="item"><b>${db.clients.length}</b><br><span class="muted">КЛИЕНТОВ</span></div><div class="item"><b>${db.programs.length}</b><br><span class="muted">ПРОГРАММ</span></div><div class="item"><b>${db.workouts.filter(w=>w.done).length}</b><br><span class="muted">ЗАВЕРШЕНО</span></div></div></section>`}
function clientCard(c){const ws=db.workouts.filter(w=>w.clientId===c.id),done=ws.filter(w=>w.done).length;return `<div class="item"><div class="row"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.goal||"Цель не указана")}</div></div><span class="tag">${ws.length?Math.round(done/ws.length*100):0}%</span></div><button class="secondary" onclick="viewClient('${c.id}')">Открыть клиента</button></div>`}
function clients(){return `<section class="panel"><div class="row"><div><div class="kicker">БАЗА КЛИЕНТОВ</div><h2>Мои клиенты</h2></div><button class="small" onclick="addClient()">＋ Клиент</button></div>${db.clients.map(clientCard).join("")||`<div class="empty">Клиентов пока нет.</div>`}</section>`}
function addClient(){openModal(`<h2>Новый клиент</h2><label>Имя</label><input id="cn" placeholder="Имя клиента"><label>Цель</label><input id="cg" placeholder="Сила, ягодицы, снижение веса..."><button class="primary" onclick="saveClient()">Создать клиента</button><button class="secondary" onclick="closeModal()">Отмена</button>`)}
function saveClient(){const name=document.getElementById("cn").value.trim();if(!name)return toast("Укажи имя");const code=Math.random().toString(36).slice(2,8).toUpperCase();db.clients.push({id:id(),name,goal:document.getElementById("cg").value.trim(),code,created:new Date().toISOString()});save();closeModal();render();toast("Клиент создан")}
function deleteClient(cid){if(!confirm("Удалить клиента и его историю?"))return;db.clients=db.clients.filter(c=>c.id!==cid);db.workouts=db.workouts.filter(w=>w.clientId!==cid);save();closeModal();render()}
function ensureClientCode(c){if(!c.code){c.code=Math.random().toString(36).slice(2,8).toUpperCase();save()}return c.code}
function clientLink(c){const code=ensureClientCode(c);const key=SUPABASE_ANON_KEY||localStorage.getItem("fit-calendar-supabase-key")||"";return location.origin+location.pathname+"?client="+encodeURIComponent(c.id)+"&code="+encodeURIComponent(code)+(key?"&sbkey="+encodeURIComponent(key):"")}
function viewClient(cid){openModal(clientDetail(db.clients.find(c=>c.id===cid)))}
function clientDetail(c){const ws=db.workouts.filter(w=>w.clientId===c.id),done=ws.filter(w=>w.done).length;return `<div class="row"><h2>${esc(c.name)}</h2><button class="small" onclick="closeModal()">✕</button></div>
<div class="client-hero"><b>Цель:</b> ${esc(c.goal||"—")}<div class="muted">Прогресс: ${ws.length?Math.round(done/ws.length*100):0}% · ${done}/${ws.length} тренировок</div></div>
<button class="primary" onclick="assignWorkout('${c.id}')">＋ Назначить тренировку</button>
<div class="linkbox" style="margin-top:12px"><b>Ссылка клиента</b><br>${esc(clientLink(c))}<button class="secondary" onclick="copyText('${esc(clientLink(c))}')">📋 Скопировать ссылку</button></div>
<h3>История</h3>${ws.slice().reverse().map(w=>workoutHistory(w)).join("")||`<div class="empty">Тренировок ещё нет.</div>`}
<button class="secondary danger" onclick="deleteClient('${c.id}')">Удалить клиента</button>`}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast("Ссылка скопирована")).catch(()=>toast("Выдели ссылку и скопируй вручную"))}
function showClientLinks(){
 if(!db.clients.length)return toast("Сначала создай клиента");
 openModal(`<div class="row"><h2>Ссылки клиентов</h2><button class="small" onclick="closeModal()">✕</button></div>${db.clients.map(c=>`<div class="item"><b>${esc(c.name)}</b><div class="linkbox" style="margin-top:7px">${esc(clientLink(c))}</div><button class="secondary" onclick="copyText('${esc(clientLink(c))}')">📋 Скопировать ссылку</button></div>`).join("")}<button class="secondary" onclick="closeModal()">Закрыть</button>`)
}
function workoutHistory(w){const p=workoutProgress(w);return `<div class="item"><div class="row"><b>${esc(w.title)}</b><span class="tag">${p}% выполнено</span></div><div class="muted">${esc(w.date)}${w.notes?" · "+esc(w.notes):""}</div>${trainerWorkoutExercises(w)}</div>`}
function trainerWorkoutExercises(w){if(!w.exercises?.length)return "";return w.exercises.map(x=>{const e=db.exercises.find(a=>a.id===x.exerciseId)||{};const actual=(x.setsData||[]).filter(s=>s.done).length;return `<div class="exercise-details" style="margin-top:9px"><b>${esc(e.name||"Упражнение")}</b><div class="muted">План: ${x.sets||0} × ${x.reps||0}${x.weight?" · "+x.weight+" кг":""}${x.rest?" · отдых "+x.rest+" сек":""}</div>${actual?`<div class="muted">Факт: выполнено ${actual} подходов</div>`:""}${x.note?`<div class="muted">📝 ${esc(x.note)}</div>`:""}${e.video?`<a href="${esc(e.video)}" target="_blank">🎥 Видео</a>`:""}</div>`}).join("")}
function library(){return `<section class="panel"><div class="row"><div><div class="kicker">ЕДИНАЯ БИБЛИОТЕКА</div><h2>Упражнения</h2></div><button class="small" onclick="addExercise()">＋ Добавить</button></div><p class="muted">Одно упражнение используется в любых программах и тренировках. Видео автоматически доступно клиенту.</p>${db.exercises.map(e=>`<div class="item"><div class="row"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.muscle)}</div></div><button class="small" onclick="editExercise('${e.id}')">Изменить</button></div>${e.video?`<div style="margin-top:9px"><a class="video-btn" href="${esc(e.video)}" target="_blank" rel="noopener">▶️ Открыть YouTube</a></div>`:`<div class="muted">YouTube-видео не добавлено</div>`}</div>`).join("")||`<div class="empty">Библиотека пуста.</div>`}</section>`}
function addExercise(){openModal(`<h2>Новое упражнение</h2><label>Название</label><input id="en" placeholder="Выпады"><label>Мышечная группа</label><input id="em" placeholder="Ноги / ягодицы / спина"><label>YouTube видео</label><input id="ev" type="url" placeholder="https://www.youtube.com/watch?v=..."><button class="primary" onclick="saveExercise()">Сохранить</button><button class="secondary" onclick="closeModal()">Отмена</button>`)}
function saveExercise(){const name=document.getElementById("en").value.trim();if(!name)return toast("Укажи название");db.exercises.push({id:id(),name,muscle:document.getElementById("em").value.trim(),video:document.getElementById("ev").value.trim()});save();closeModal();render();toast("Упражнение сохранено")}
function editExercise(eid){const e=db.exercises.find(x=>x.id===eid);openModal(`<h2>Изменить упражнение</h2><label>Название</label><input id="en" value="${esc(e.name)}"><label>Мышечная группа</label><input id="em" value="${esc(e.muscle)}"><label>YouTube видео</label><input id="ev" type="url" value="${esc(e.video)}" placeholder="https://www.youtube.com/watch?v=..."><button class="primary" onclick="updateExercise('${eid}')">Сохранить</button><button class="secondary danger" onclick="removeExercise('${eid}')">Удалить</button>`)}
function updateExercise(eid){const e=db.exercises.find(x=>x.id===eid);e.name=document.getElementById("en").value.trim();e.muscle=document.getElementById("em").value.trim();e.video=document.getElementById("ev").value.trim();save();closeModal();render();toast("Изменения сохранены")}
function removeExercise(eid){db.exercises=db.exercises.filter(e=>e.id!==eid);save();closeModal();render();toast("Упражнение удалено")}

function programExercisesView(p){return (p.exercises||[]).map(x=>{const e=db.exercises.find(a=>a.id===x.exerciseId)||{};return `<div class="exercise-box"><b>${esc(e.name||"Упражнение")}</b><div class="muted">${x.sets||0} подхода · ${x.reps||0} повт.${x.weight?" · "+x.weight+" кг":""}${x.rest?" · "+x.rest+" сек отдых":""}</div>${(x.video||e.video)?`<div style="margin-top:8px"><a class="video-btn" href="${esc(x.video||e.video)}" target="_blank" rel="noopener">▶️ YouTube</a></div>`:""}</div>`}).join("")}
function programs(){return `<section class="panel"><div class="row"><div><div class="kicker">ШАБЛОНЫ</div><h2>Программы</h2></div><button class="small" onclick="addProgram()">＋ Создать</button></div>${db.programs.map(p=>`<div class="item"><div class="row"><b>${esc(p.name)}</b><button class="small" onclick="editProgram('${p.id}')">Изменить</button></div><div class="muted">${esc(p.goal||"")}</div>${programExercisesView(p)}</div>`).join("")||`<div class="empty">Создай первую программу.</div>`}</section>`}

function monthCalendar(y,m,opts={}){
 const now=new Date(),today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`,first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;
 let cells=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>`<div class="muted" style="font-size:9px;text-align:center;font-weight:800">${x}</div>`).join("");
 for(let i=0;i<offset;i++)cells+="<div></div>";
 for(let d=1;d<=days;d++){
  const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,ws=(opts.workouts||db.workouts).filter(w=>w.date===ds);
  const has=ws.length>0,allDone=has&&ws.every(w=>w.done),cls=`day ${ds===today?"today ":""}${has?"has-workout ":""}${allDone?"done-day":""}`;
  const dots=ws.slice(0,2).map(w=>opts.client?`<span class="schedule-dot">${w.done?"✓ ":""}${esc(w.title)}</span>`:`<span class="dot">${esc((db.clients.find(c=>c.id===w.clientId)||{}).name||"Клиент")}</span>`).join("");
  cells+=opts.client?`<div class="${cls}"><b>${d}</b>${dots}</div>`:`<div class="${cls}" onclick="openDay('${ds}')"><b>${d}</b>${dots}</div>`;
 }
 return `<div class="month-card"><div class="month-title">${new Date(y,m,1).toLocaleString("ru-RU",{month:"long",year:"numeric"})}</div><div class="calendar">${cells}</div></div>`;
}
function calendarMonths(workouts=db.workouts){
 const now=new Date(),months=[];for(let m=now.getMonth();m<=11;m++)months.push(monthCalendar(now.getFullYear(),m,{workouts}));
 return months.join("");
}

async function connectSupabase(){const k=(document.getElementById("sbkey")?.value||"").trim();if(!k)return toast("Вставь publishable key");localStorage.setItem("fit-calendar-supabase-key",k);SUPABASE_ANON_KEY=k;if(initCloud()){const ok=await loadCloud();render();toast(ok?"Облако подключено":"Не удалось подключить")}else toast("Не удалось инициализировать Supabase")}

function normalizeWorkouts(){
 db.workouts.forEach(w=>{
  if(!Array.isArray(w.exercises)){
   w.exercises=(w.exerciseIds||[]).map(eid=>({exerciseId:eid,sets:0,reps:0,weight:0,rest:0,note:"",setsData:[]}));
  }
  w.exercises.forEach(x=>{if(!x.video){const e=db.exercises.find(a=>a.id===x.exerciseId);if(e?.video)x.video=e.video}
   if(!Array.isArray(x.setsData))x.setsData=Array.from({length:x.sets||0},()=>({done:false,reps:x.reps||0,weight:x.weight||0}));
  });
 });
}

function clientMini(w){const p=workoutProgress(w);return `<div class="item"><div class="row"><b>${esc(w.title)}</b><span class="tag">${p}% выполнено</span></div><div class="muted">${esc(w.date)}</div></div>`}
function clientWorkoutCard(w){const p=workoutProgress(w);return `<div class="kicker">ТРЕНИРОВКА</div><h2>${esc(w.title)}</h2><div class="muted">${esc(w.date)}</div><div class="progress"><i style="width:${p}%"></i></div><div class="muted"><b>${p}% выполнено</b> · отмечено ${p}% подходов</div>${(w.exercises||[]).map((x,i)=>clientExercise(w,x,i)).join("")}<button class="primary" onclick="finishWorkout('${w.id}')">✅ Завершить тренировку</button>`}
function workoutProgress(w){const all=(w.exercises||[]).reduce((n,e)=>n+(Number(e.sets)||((e.setsData||[]).length)),0),done=(w.exercises||[]).reduce((n,e)=>n+(e.setsData||[]).filter(s=>s.done).length,0);return all?Math.min(100,Math.round(done/all*100)):0}
function clientExercise(w,x,ei){const e=db.exercises.find(a=>a.id===x.exerciseId)||{};return `<div class="exercise-box"><div class="row"><b>${esc(e.name||"Упражнение")}</b>${e.muscle?`<span class="tag">${esc(e.muscle)}</span>`:""}</div><div class="muted">План: ${x.sets||0} × ${x.reps||0}${x.weight?" · "+x.weight+" кг":""}${x.rest?" · отдых "+x.rest+" сек":""}</div>${(x.video||e.video)?`<div style="margin:9px 0"><a class="video-btn" href="${esc(x.video||e.video)}" target="_blank" rel="noopener">▶️ Смотреть видео на YouTube</a></div>`:""}${(x.setsData||[]).map((s,si)=>`<div class="set-row ${s.done?"done":""}"><span class="set-num">${si+1}</span><div class="set-label">ПОДХОД</div><input type="number" min="0" value="${s.reps??x.reps??0}" onchange="setActual('${w.id}',${ei},${si},'reps',this.value)" placeholder="Повторы"><input type="number" min="0" step=".5" value="${s.weight??x.weight??0}" onchange="setActual('${w.id}',${ei},${si},'weight',this.value)" placeholder="Вес кг"><label class="set-done"><input class="set-check" type="checkbox" ${s.done?"checked":""} onchange="toggleSet('${w.id}',${ei},${si},this.checked)"><span>✓</span></label></div>`).join("")}${x.note?`<div class="muted">📝 ${esc(x.note)}</div>`:""}</div>`}
function findWorkout(wid){return db.workouts.find(w=>w.id===wid)}
function toggleSet(wid,ei,si,done){const w=findWorkout(wid);if(!w?.exercises?.[ei]?.setsData?.[si])return;w.exercises[ei].setsData[si].done=done;w.done=workoutProgress(w)>=100;save();renderClient()}
function setActual(wid,ei,si,key,val){const w=findWorkout(wid);if(!w?.exercises?.[ei]?.setsData?.[si])return;w.exercises[ei].setsData[si][key]=Number(val)||0;save()}
function finishWorkout(wid){const w=findWorkout(wid);if(!w)return;const p=workoutProgress(w);if(p<100){if(!confirm("Выполнено "+p+"%. Не все подходы отмечены. Сохранить тренировку с фактическим результатом?"))return}w.done=p>=100;w.completedAt=new Date().toISOString();w.completedPercent=p;save();renderClient();toast(p>=100?"Тренировка выполнена на 100% 💪":"Тренировка сохранена: "+p+"% 💪")}
function clientLogout(){clientSession=null;history.replaceState({},document.title,location.pathname);render()}
function normalizeClients(){let changed=false;db.clients.forEach(c=>{if(!c.code){c.code=Math.random().toString(36).slice(2,8).toUpperCase();changed=true}});if(changed)save();return changed}
function detectClient(){const q=new URLSearchParams(location.search),cid=q.get("client"),code=q.get("code");if(!cid||!code)return false;const c=db.clients.find(x=>x.id===cid&&x.code===code);if(c){clientSession=c;return true}return false}

normalizeWorkouts();normalizeClients();localSave();window.tab="home";render();
(async()=>{if(initCloud()){await loadCloud();normalizeClients();if(!detectClient())render();else renderClient()}else{detectClient();render()}})();
</script>
