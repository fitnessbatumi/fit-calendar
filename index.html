<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Fit Calendar Premium 8.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#fff8fc,#f3efff);color:#261e2d}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:780px;margin:auto;padding:16px 14px 100px}.hero{color:#fff;border-radius:30px;padding:24px;background:linear-gradient(135deg,#ec4899,#a855f7 55%,#6366f1);box-shadow:0 18px 45px #7c3aed30}.hero small{letter-spacing:2px;font-weight:800}.hero h1{margin:7px 0;font-size:34px}.hero p{margin:0 0 18px;opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#ffffff20;border:1px solid #ffffff44;border-radius:17px;padding:11px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:10px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:15px 0}.nav button{padding:10px 3px;border-radius:15px;background:#fff;border:1px solid #eadff1;color:#675d6c;font-size:11px;font-weight:800}.nav button.on{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff}.card{background:#fff;border:1px solid #eadff1;border-radius:23px;padding:18px;margin:13px 0;box-shadow:0 8px 30px #46205c10}.label{font-size:11px;color:#c23c83;font-weight:900;letter-spacing:1.4px}.card h2{margin:4px 0 13px}.muted{font-size:13px;color:#776e7d;line-height:1.5}.btn{padding:12px 15px;border-radius:14px;font-weight:800}.primary{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff}.soft{background:#f1ebf7;color:#514657}.danger{background:#fee2e2;color:#991b1b}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,select,textarea{width:100%;padding:11px;border:1px solid #eadff1;border-radius:13px;background:#faf8fc;color:#261e2d}textarea{min-height:80px}.item{padding:14px;border:1px solid #eadff1;border-radius:17px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{display:inline-block;background:#f4e8ff;color:#7134a7;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions .btn{font-size:12px}.progress{height:9px;background:#eee7f3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ec4899,#8b5cf6)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#170f1b88;z-index:20;display:flex;align-items:flex-end;padding:10px}.modalbox{background:#fff;width:min(760px,100%);max-height:93vh;overflow:auto;border-radius:27px;padding:19px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border-radius:50%;background:#f1ebf7}.check{background:#ecfdf5;border-color:#bbf7d0}.exercise-line{display:grid;grid-template-columns:1.4fr .55fr .55fr .6fr;gap:6px;margin:8px 0}.exercise-line input{padding:8px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#261e2d;color:#fff;padding:11px 16px;border-radius:99px;z-index:30;font-size:13px}@media(max-width:520px){.nav button{font-size:9px}.grid2{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style>
</head>
<body><div id="root"></div>
<script>
const KEY="fitcal-premium-8";
const initial={trainer:{name:"Мой тренер",youtube:""},library:[
{id:"e1",name:"Присед со штангой",muscle:"Ягодицы + ноги",sets:3,reps:10,weight:40,video:"",note:"Контролируемая техника"},
{id:"e2",name:"Ягодичный мост",muscle:"Ягодицы",sets:3,reps:12,weight:30,video:"",note:"Пауза вверху"},
{id:"e3",name:"Румынская тяга",muscle:"Задняя поверхность бедра",sets:3,reps:10,weight:30,video:"",note:"Спина нейтральная"}],clients:[]};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||initial;
let ui={tab:"home",client:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid=()=>Math.random().toString(36).slice(2,10);
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function notify(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}
function stats(){let days=db.clients.flatMap(c=>c.program||[]);return [days.length,days.filter(d=>d.done).length,days.length?Math.round(days.filter(d=>d.done).length/days.length*100):0]}
function shell(content){
let [total,done,pct]=stats();
root.innerHTML=`<div class="wrap"><section class="hero"><small>FIT CALENDAR · PREMIUM 8.0</small><h1>Твой тренерский кабинет</h1><p>Клиенты · программы · библиотека · прогресс</p><div class="stats"><div class="stat"><b>${total}</b><span>ТРЕНИРОВОК</span></div><div class="stat"><b>${done} ✓</b><span>ВЫПОЛНЕНО</span></div><div class="stat"><b>${pct}%</b><span>ПРОГРЕСС</span></div></div></section>
<nav class="nav">${[["home","✨","Главная"],["calendar","📅","Календарь"],["library","📚","Библиотека"],["clients","👩","Клиенты"],["trainer","⚙️","Тренер"]].map(x=>`<button class="${ui.tab==x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join("")}</nav>${content}<div class="muted" style="text-align:center;margin-top:25px">Fit Calendar Premium 8.0</div></div>`;
}
function go(t){ui.tab=t;ui.client=null;render()}
function home(){return `<div class="card"><div class="label">ПАНЕЛЬ ТРЕНЕРА</div><h2>Готово к работе 🚀</h2><p class="muted">Создай клиентов, собери программы из общей библиотеки и отслеживай выполнение.</p><div class="grid2"><button class="btn primary" onclick="newClient()">＋ Новый клиент</button><button class="btn soft" onclick="newExercise()">＋ Упражнение</button></div></div>
<div class="card"><h2>Как работает система</h2><p class="muted">1. Создаёшь упражнение один раз. 2. Добавляешь его в программу нужной клиентки. 3. Задаёшь вес, подходы и повторы. 4. Отправляешь персональную ссылку.</p></div>`}
function library(){return `<div class="card"><div class="row"><div><div class="label">ОБЩАЯ БИБЛИОТЕКА</div><h2>Упражнения</h2></div><button class="btn primary" onclick="newExercise()">＋ Добавить</button></div><p class="muted">Упражнение хранится здесь один раз и доступно для всех программ.</p>${db.library.map(e=>`<div class="item"><div class="row"><div><b>${esc(e.name)}</b><br><span class="tag">${esc(e.muscle)}</span></div><button class="btn soft" onclick="editExercise('${e.id}')">Изменить</button></div><p class="muted">${e.sets} × ${e.reps} · ${e.weight||0} кг${e.note?" · "+esc(e.note):""}</p>${e.video?`<div class="muted">🎥 <a href="${esc(e.video)}" target="_blank">Видео YouTube</a></div>`:""}<div class="actions"><button class="btn danger" onclick="removeExercise('${e.id}')">Удалить</button></div></div>`).join("")}</div>`}
function clients(){return `<div class="card"><div class="row"><div><div class="label">БАЗА КЛИЕНТОВ</div><h2>Мои клиенты</h2></div><button class="btn primary" onclick="newClient()">＋ Клиент</button></div><p class="muted">У каждого клиента своя программа и персональная ссылка.</p>${db.clients.length?db.clients.map(c=>`<div class="item"><div class="row"><div><b>${esc(c.name)}</b><br><span class="muted">${esc(c.goal||"Цель не указана")} · ${(c.program||[]).length} тренировок</span></div><button class="btn primary" onclick="openClient('${c.id}')">Открыть</button></div><div class="progress" style="margin-top:10px"><i style="width:${progress(c)}%"></i></div><div class="muted" style="margin-top:5px">${progress(c)}% выполнено</div><div class="actions"><button class="btn soft" onclick="share('${c.id}')">🔗 Ссылка клиенту</button><button class="btn danger" onclick="removeClient('${c.id}')">Удалить</button></div></div>`).join(""):"<p class='muted'>Клиентов пока нет.</p>"}</div>`}
function progress(c){let p=c.program||[];return p.length?Math.round(p.filter(x=>x.done).length/p.length*100):0}
function openClient(id){ui.tab="clients";ui.client=id;render()}
function clientPage(c){return `<div class="card"><div class="row"><div><div class="label">ПЕРСОНАЛЬНАЯ ПРОГРАММА</div><h2>${esc(c.name)}</h2></div><button class="btn soft" onclick="ui.client=null;render()">← Назад</button></div><p class="muted">${esc(c.goal||"")} </p><div class="grid2"><button class="btn primary" onclick="newDay('${c.id}')">＋ Тренировочный день</button><button class="btn soft" onclick="share('${c.id}')">🔗 Персональная ссылка</button></div></div>
${(c.program||[]).map(d=>day(c,d)).join("")||`<div class="card"><p class="muted">Программа пустая. Добавь первый тренировочный день.</p></div>`}
<div class="card"><h2>📊 Прогресс</h2><b>${progress(c)}%</b><div class="progress" style="margin:10px 0"><i style="width:${progress(c)}%"></i></div><p class="muted">Выполнено ${(c.program||[]).filter(x=>x.done).length} из ${(c.program||[]).length} тренировок.</p></div>`}
function day(c,d){return `<div class="card"><div class="row"><div><b>${esc(d.title)}</b><br><span class="muted">${esc(d.date)}</span></div><button class="btn danger" onclick="removeDay('${c.id}','${d.id}')">Удалить</button></div>
${(d.exercises||[]).map((x,i)=>`<div class="exercise-line"><input value="${esc(x.name)}" onchange="changeEx('${c.id}','${d.id}',${i},'name',this.value)"><input type="number" value="${x.sets}" title="Подходы" onchange="changeEx('${c.id}','${d.id}',${i},'sets',this.value)"><input type="number" value="${x.reps}" title="Повторы" onchange="changeEx('${c.id}','${d.id}',${i},'reps',this.value)"><input type="number" value="${x.weight}" title="Вес кг" onchange="changeEx('${c.id}','${d.id}',${i},'weight',this.value)"></div>`).join("")}
<div class="actions"><button class="btn soft" onclick="chooseExercise('${c.id}','${d.id}')">＋ Из библиотеки</button><button class="btn soft" onclick="customExercise('${c.id}','${d.id}')">＋ Своё</button><button class="btn ${d.done?"soft":"primary"}" onclick="toggleDay('${c.id}','${d.id}')">${d.done?"↩ Отменить":"✓ Выполнено"}</button></div></div>`}
function calendar(){let a=db.clients.flatMap(c=>(c.program||[]).map(d=>({...d,client:c.name}))).sort((x,y)=>(x.date||"").localeCompare(y.date||""));return `<div class="card"><div class="label">КАЛЕНДАРЬ</div><h2>Все тренировки</h2>${a.length?a.map(d=>`<div class="item"><div class="row"><b>${esc(d.date)} · ${esc(d.title)}</b><span class="tag">${esc(d.client)}</span></div><span class="muted">${d.done?"✓ Выполнено":"Запланировано"} · ${(d.exercises||[]).length} упражнений</span></div>`).join(""):"<p class='muted'>Пока пусто.</p>"}</div>`}
function trainer(){return `<div class="card"><div class="label">НАСТРОЙКИ ТРЕНЕРА</div><h2>👨‍🏫 Профиль</h2><label class="muted">Имя тренера</label><input id="tn" value="${esc(db.trainer.name)}"><label class="muted">YouTube-ссылка тренера</label><input id="tv" value="${esc(db.trainer.youtube)}" placeholder="https://youtube.com/..."><button class="btn primary" style="margin-top:10px" onclick="saveTrainer()">Сохранить</button></div>
<div class="card"><h2>☁️ Облачная версия</h2><p class="muted">Этот файл — рабочая тренерская версия интерфейса. Сейчас данные сохраняются в браузере. Следующий технический этап — подключить Supabase: авторизацию, облачную библиотеку, клиентов и синхронизацию результатов.</p></div>
<div class="card"><h2>💾 Резервная копия</h2><button class="btn soft" onclick="backup()">Скачать JSON</button><button class="btn soft" onclick="restore()">Восстановить JSON</button></div>`}
function render(){if(ui.tab=="home")shell(home());else if(ui.tab=="library")shell(library());else if(ui.tab=="clients")shell(ui.client?clientPage(db.clients.find(c=>c.id==ui.client)):clients());else if(ui.tab=="calendar")shell(calendar());else shell(trainer())}
function modal(title,body){let m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="this.closest('.modal').remove()">×</button></div>${body}</div>`;document.body.appendChild(m);return m}
function newExercise(e){e=e||{id:"",name:"",muscle:"",sets:3,reps:10,weight:0,video:"",note:""};modal(e.id?"Изменить упражнение":"Добавить упражнение",`<input id="xname" placeholder="Название" value="${esc(e.name)}"><input id="xmuscle" style="margin-top:8px" placeholder="Мышечная группа" value="${esc(e.muscle)}"><div class="grid3" style="margin-top:8px"><input id="xsets" type="number" value="${e.sets}" placeholder="Подходы"><input id="xreps" type="number" value="${e.reps}" placeholder="Повторы"><input id="xweight" type="number" value="${e.weight}" placeholder="Вес кг"></div><input id="xvideo" style="margin-top:8px" placeholder="YouTube-ссылка" value="${esc(e.video)}"><textarea id="xnote" style="margin-top:8px" placeholder="Комментарий">${esc(e.note)}</textarea><button class="btn primary" style="margin-top:10px" onclick="saveExercise('${e.id}',this)">Сохранить упражнение</button>`)}
function editExercise(id){newExercise(db.library.find(x=>x.id==id))}
function saveExercise(id,b){let e={id:id||uid(),name:xname.value.trim(),muscle:xmuscle.value.trim()||"Другое",sets:+xsets.value||0,reps:+xreps.value||0,weight:+xweight.value||0,video:xvideo.value.trim(),note:xnote.value.trim()};if(!e.name)return notify("Укажи название");let i=db.library.findIndex(x=>x.id==id);i<0?db.library.push(e):db.library[i]=e;b.closest(".modal").remove();persist();render();notify("Упражнение сохранено ✓")}
function removeExercise(id){if(confirm("Удалить упражнение из библиотеки?")){db.library=db.library.filter(x=>x.id!=id);persist();render()}}
function newClient(){modal("Добавить клиента",`<input id="cname" placeholder="Имя клиента"><input id="cgoal" style="margin-top:8px" placeholder="Цель клиента"><button class="btn primary" style="margin-top:10px" onclick="saveClient(this)">Создать</button>`)}
function saveClient(b){let name=cname.value.trim();if(!name)return notify("Укажи имя");db.clients.push({id:uid(),name,goal:cgoal.value.trim(),program:[]});b.closest(".modal").remove();persist();render();notify("Клиент добавлен ✓")}
function removeClient(id){if(confirm("Удалить клиента и его программу?")){db.clients=db.clients.filter(c=>c.id!=id);ui.client=null;persist();render()}}
function newDay(cid){modal("Новый тренировочный день",`<input id="dtitle" placeholder="Например: Ягодицы + ноги"><input id="ddate" type="date" style="margin-top:8px" value="${new Date().toISOString().slice(0,10)}"><button class="btn primary" style="margin-top:10px" onclick="saveDay('${cid}',this)">Создать</button>`)}
function saveDay(cid,b){let c=db.clients.find(x=>x.id==cid);c.program.push({id:uid(),title:dtitle.value.trim()||"Новая тренировка",date:ddate.value,done:false,exercises:[]});b.closest(".modal").remove();persist();render()}
function removeDay(cid,did){let c=db.clients.find(x=>x.id==cid);c.program=c.program.filter(d=>d.id!=did);persist();render()}
function chooseExercise(cid,did){let list=db.library.map(e=>`<button class="btn soft" style="display:block;width:100%;text-align:left;margin:7px 0" onclick="pickExercise('${cid}','${did}','${e.id}',this)">${esc(e.name)} · ${esc(e.muscle)}</button>`).join("");modal("Выбери из общей библиотеки",list||"<p>Библиотека пустая.</p>")}
function pickExercise(cid,did,eid,b){let c=db.clients.find(x=>x.id==cid),d=c.program.find(x=>x.id==did),e=db.library.find(x=>x.id==eid);d.exercises.push({id:uid(),name:e.name,muscle:e.muscle,sets:e.sets,reps:e.reps,weight:e.weight,video:e.video,note:e.note});b.closest(".modal").remove();persist();render()}
function customExercise(cid,did){modal("Своё упражнение",`<input id="sname" placeholder="Название"><div class="grid3" style="margin-top:8px"><input id="ssets" type="number" value="3"><input id="sreps" type="number" value="10"><input id="sweight" type="number" value="0"></div><button class="btn primary" style="margin-top:10px" onclick="saveCustom('${cid}','${did}',this)">Добавить</button>`)}
function saveCustom(cid,did,b){let c=db.clients.find(x=>x.id==cid),d=c.program.find(x=>x.id==did);d.exercises.push({id:uid(),name:sname.value,sets:+ssets.value||0,reps:+sreps.value||0,weight:+sweight.value||0});b.closest(".modal").remove();persist();render()}
function changeEx(cid,did,i,k,v){let d=db.clients.find(c=>c.id==cid).program.find(d=>d.id==did);d.exercises[i][k]=k=="name"?v:+v;persist()}
function toggleDay(cid,did){let d=db.clients.find(c=>c.id==cid).program.find(d=>d.id==did);d.done=!d.done;persist();render()}
function share(id){let c=db.clients.find(x=>x.id==id);let data=btoa(unescape(encodeURIComponent(JSON.stringify({name:c.name,goal:c.goal,program:c.program,trainer:db.trainer.name,youtube:db.trainer.youtube}))));let link=location.origin+location.pathname+"?client="+encodeURIComponent(data);modal("🔗 Персональная ссылка",`<p class="muted">Отправь эту ссылку клиенту. В этой локальной версии ссылка содержит программу, но результаты клиента ещё не синхронизируются с твоим кабинетом.</p><textarea id="link">${esc(link)}</textarea><button class="btn primary" style="margin-top:10px" onclick="navigator.clipboard?.writeText(link.value);notify('Скопировано ✓')">📋 Скопировать</button>`)}
function saveTrainer(){db.trainer.name=tn.value.trim()||"Мой тренер";db.trainer.youtube=tv.value.trim();persist();notify("Профиль сохранён ✓")}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="fit-calendar-backup.json";a.click()}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);persist();render();notify("Восстановлено ✓")}catch(e){notify("Неверный файл")}};r.readAsText(i.files[0])};i.click()}
function clientMode(payload){try{return JSON.parse(decodeURIComponent(escape(atob(payload))))}catch(e){return null}}
const qp=new URLSearchParams(location.search).get("client");
if(qp){let c=clientMode(qp);root.innerHTML=`<div class="wrap"><section class="hero"><small>PERSONAL PROGRAM</small><h1>Fit Calendar</h1><p>${esc(c?.name||"Моя программа")} · ${esc(c?.goal||"Персональная программа")}</p></section><div class="card"><h2>👋 Привет, ${esc(c?.name||"спортсмен")}!</h2><p class="muted">Здесь твоя персональная программа. Выполняй тренировку и отмечай её после завершения.</p>${(c?.program||[]).map(d=>`<div class="item"><div class="row"><b>${esc(d.title)}</b><span class="tag">${esc(d.date)}</span></div>${(d.exercises||[]).map(x=>`<div class="item"><b>${esc(x.name)}</b><br><span class="muted">${x.sets} подхода × ${x.reps} повторов · ${x.weight||0} кг</span>${x.video?`<br><a href="${esc(x.video)}" target="_blank">🎥 Смотреть видео</a>`:""}</div>`).join("")}<button class="btn primary" style="width:100%;margin-top:8px" onclick="this.textContent='✓ Отмечено';this.disabled=true">Отметить тренировку ✓</button></div>`).join("")||"<p class='muted'>Программа пока не добавлена.</p>"}</div><div class="muted" style="text-align:center">Fit Calendar Premium</div></div>`}else render();
</script></body></html>
